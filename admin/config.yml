backend:
  name: github
  repo: Batbos/caravel-travel
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "tours"
    label: "Tours"
    folder: "content/tours"
    create: true
    fields:
      - label: "Tour Name"
        name: "title"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Price"
        name: "price"
        widget: "string"

      - label: "Duration"
        name: "duration"
        widget: "string"

      - label: "Image"
        name: "image"
        widget: "image"
